[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Streamlit multipage requires numeric-prefixed filenames like 01_xxx.py
ignore = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-fail-under=80"

[tool.coverage.run]
# Streamlit page files are UI-only and cannot be tested without the Streamlit runtime
omit = ["app/pages/*"]

[tool.coverage.report]
fail_under = 80
